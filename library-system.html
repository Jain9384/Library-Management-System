<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="shortcut icon" href="img/logo2.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Library Management System Specific Styles */
        .library-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .library-header {
            background: linear-gradient(135deg, #252A34, #08D9D6);
            color: white;
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 16px;
            border-radius: 25px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: white;
            color: #252A34;
        }

        .controls-section {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .search-add-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #08D9D6;
        }

        .add-book-btn {
            background: linear-gradient(135deg, #08D9D6, #252A34);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .add-book-btn:hover {
            transform: translateY(-2px);
        }

        .books-table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .books-table {
            width: 100%;
            border-collapse: collapse;
        }

        .books-table th {
            background: linear-gradient(135deg, #252A34, #08D9D6);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .books-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .books-table tr:hover {
            background-color: #f8f9fa;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 2px;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .edit-btn {
            background-color: #ffc107;
            color: #212529;
        }

        .edit-btn:hover {
            background-color: #e0a800;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 2rem;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }

        .close:hover {
            color: #000;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #252A34;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #08D9D6;
        }

        .form-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #08D9D6, #252A34);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            color: white;
            font-weight: 600;
            z-index: 1001;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background-color: #28a745;
        }

        .notification.error {
            background-color: #dc3545;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }

        .empty-state h3 {
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .library-container {
                padding: 10px;
            }

            .back-btn {
                position: static;
                transform: none;
                margin-bottom: 1rem;
                display: inline-block;
            }

            .library-header {
                text-align: left;
                padding: 1rem;
            }

            .search-add-container {
                flex-direction: column;
                align-items: stretch;
            }

            .books-table-container {
                overflow-x: auto;
            }

            .books-table {
                min-width: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="library-container">
        <!-- Header -->
        <div class="library-header">
            <a href="index.html" class="back-btn">← Back to Main Site</a>
            <h1>📚 Library Management System</h1>
            <p>Manage your book collection with ease</p>
        </div>

        <!-- Controls Section -->
        <div class="controls-section">
            <div class="search-add-container">
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search books by title, author, or category...">
                <button id="addBookBtn" class="add-book-btn">➕ Add New Book</button>
            </div>
        </div>

        <!-- Books Table -->
        <div class="books-table-container">
            <table class="books-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Book Title</th>
                        <th>Category</th>
                        <th>Author</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="booksTableBody">
                    <!-- Books will be populated here -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                <h3>📚 No Books Found</h3>
                <p>Start building your library by adding your first book!</p>
            </div>
        </div>
    </div>

    <!-- Add/Edit Book Modal -->
    <div id="bookModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add New Book</h2>
            <form id="bookForm">
                <div class="form-group">
                    <label for="bookTitle">Book Title *</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label for="bookCategory">Category *</label>
                    <select id="bookCategory" required>
                        <option value="">Select a category</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Non-Fiction">Non-Fiction</option>
                        <option value="Science">Science</option>
                        <option value="Technology">Technology</option>
                        <option value="History">History</option>
                        <option value="Biography">Biography</option>
                        <option value="Mystery">Mystery</option>
                        <option value="Romance">Romance</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Self-Help">Self-Help</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bookAuthor">Author *</label>
                    <input type="text" id="bookAuthor" required>
                </div>
                <div class="form-buttons">
                    <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Book</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script>
        // Library Management System JavaScript
        class LibraryManager {
            constructor() {
                this.books = this.loadBooks();
                this.currentEditId = null;
                this.init();
            }

            init() {
                this.renderBooks();
                this.bindEvents();
            }

            bindEvents() {
                // Add book button
                document.getElementById('addBookBtn').addEventListener('click', () => {
                    this.openModal();
                });

                // Search functionality
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchBooks(e.target.value);
                });

                // Modal events
                document.querySelector('.close').addEventListener('click', () => {
                    this.closeModal();
                });

                document.getElementById('cancelBtn').addEventListener('click', () => {
                    this.closeModal();
                });

                // Form submission
                document.getElementById('bookForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveBook();
                });

                // Close modal when clicking outside
                window.addEventListener('click', (e) => {
                    const modal = document.getElementById('bookModal');
                    if (e.target === modal) {
                        this.closeModal();
                    }
                });
            }

            loadBooks() {
                const stored = localStorage.getItem('libraryBooks');
                if (stored) {
                    return JSON.parse(stored);
                }
                
                // Initialize with sample data from db.json
                const sampleBooks = [
                    { id: "100", name: "The Great Gatsby", category: "Fiction", brand: "F. Scott Fitzgerald" },
                    { id: "101", name: "Deep Work", category: "Self-Help", brand: "Cal Newport" },
                    { id: "102", name: "The Pragmatic Programmer", category: "Technology", brand: "Andrew Hunt & David Thomas" },
                    { id: "103", name: "The Selfish Gene", category: "Science", brand: "Richard Dawkins" },
                    { id: "104", name: "Atomic Habits", category: "Non-Fiction", brand: "James Clear" },
                    { id: "105", name: "Thinking, Fast and Slow", category: "Non-Fiction", brand: "Daniel Kahneman" }
                ];
                
                this.saveBooks(sampleBooks);
                return sampleBooks;
            }

            saveBooks(books = this.books) {
                localStorage.setItem('libraryBooks', JSON.stringify(books));
            }

            generateId() {
                return Date.now().toString();
            }

            renderBooks(booksToRender = this.books) {
                const tbody = document.getElementById('booksTableBody');
                const emptyState = document.getElementById('emptyState');
                
                if (booksToRender.length === 0) {
                    tbody.innerHTML = '';
                    emptyState.style.display = 'block';
                    return;
                }

                emptyState.style.display = 'none';
                
                tbody.innerHTML = booksToRender.map(book => `
                    <tr>
                        <td>${book.id}</td>
                        <td>${book.name}</td>
                        <td>${book.category}</td>
                        <td>${book.brand}</td>
                        <td>
                            <button class="action-btn edit-btn" onclick="libraryManager.editBook('${book.id}')">
                                ✏️ Edit
                            </button>
                            <button class="action-btn delete-btn" onclick="libraryManager.deleteBook('${book.id}')">
                                🗑️ Delete
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            searchBooks(query) {
                if (!query.trim()) {
                    this.renderBooks();
                    return;
                }

                const filtered = this.books.filter(book => 
                    book.name.toLowerCase().includes(query.toLowerCase()) ||
                    book.category.toLowerCase().includes(query.toLowerCase()) ||
                    book.brand.toLowerCase().includes(query.toLowerCase())
                );

                this.renderBooks(filtered);
            }

            openModal(book = null) {
                const modal = document.getElementById('bookModal');
                const modalTitle = document.getElementById('modalTitle');
                const form = document.getElementById('bookForm');

                if (book) {
                    modalTitle.textContent = 'Edit Book';
                    document.getElementById('bookTitle').value = book.name;
                    document.getElementById('bookCategory').value = book.category;
                    document.getElementById('bookAuthor').value = book.brand;
                    this.currentEditId = book.id;
                } else {
                    modalTitle.textContent = 'Add New Book';
                    form.reset();
                    this.currentEditId = null;
                }

                modal.style.display = 'block';
            }

            closeModal() {
                document.getElementById('bookModal').style.display = 'none';
                document.getElementById('bookForm').reset();
                this.currentEditId = null;
            }

            saveBook() {
                const title = document.getElementById('bookTitle').value.trim();
                const category = document.getElementById('bookCategory').value;
                const author = document.getElementById('bookAuthor').value.trim();

                if (!title || !category || !author) {
                    this.showNotification('Please fill in all required fields', 'error');
                    return;
                }

                if (this.currentEditId) {
                    // Edit existing book
                    const bookIndex = this.books.findIndex(book => book.id === this.currentEditId);
                    if (bookIndex !== -1) {
                        this.books[bookIndex] = {
                            id: this.currentEditId,
                            name: title,
                            category: category,
                            brand: author
                        };
                        this.showNotification('Book updated successfully!', 'success');
                    }
                } else {
                    // Add new book
                    const newBook = {
                        id: this.generateId(),
                        name: title,
                        category: category,
                        brand: author
                    };
                    this.books.push(newBook);
                    this.showNotification('Book added successfully!', 'success');
                }

                this.saveBooks();
                this.renderBooks();
                this.closeModal();
            }

            editBook(id) {
                const book = this.books.find(book => book.id === id);
                if (book) {
                    this.openModal(book);
                }
            }

            deleteBook(id) {
                const book = this.books.find(book => book.id === id);
                if (book && confirm(`Are you sure you want to delete "${book.name}"?`)) {
                    this.books = this.books.filter(book => book.id !== id);
                    this.saveBooks();
                    this.renderBooks();
                    this.showNotification('Book deleted successfully!', 'success');
                }
            }

            showNotification(message, type) {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.className = `notification ${type}`;
                notification.classList.add('show');

                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        }

        // Initialize the library manager
        const libraryManager = new LibraryManager();
    </script>
</body>
</html>
